<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <title>Home</title>
</head>
<body>
    <div id="navbar">
        <h2 id="name">Unique Animal House</h2>
        <div id="navbar-links">
            <a href="index.html">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>
    <div id="heading">
        <h1 style="text-align: center;">Welcome to Unique Animals Gallery</h1>
        <p style="text-align: center;">Exploring unique animals in the world</p>
    </div>
    <div id="search">
        <input type="text" id="search-by-region" placeholder="Search Animals by region...">
        <button id="add-new-animal">Add a new Animal</button>
    </div>
    <div id="outer-container">
        <div id="container">

        </div>
    </div>

    <div id="footer">
        <p>Copyright 2025</p>
    </div>

    <script>
        const baseUrl = "http://127.0.0.1:8080/"
        const container = document.getElementById("container");
        const addNewBtn = document.getElementById("add-new-animal")
        const searchInput = document.getElementById("search-by-region");

        addNewBtn.onclick = function() {
             window.location.href = " new-animal-form.html"
        };

        function createAnimalCard(animal){
            const card = document.createElement('div');
            card.className = 'animal-card';

            const img = document.createElement('img');
            img.src = animal.imageUrl;
            img.alt = animal.name

            const animalName = document.createElement('h3');
            animalName.textContent = animal.name;

            const uniqueElements = document.createElement('p');
            uniqueElements.textContent = animal.summary;

            const cardHeading = document.createElement('div')
            cardHeading.className = "card-heading"

            const cardRegion = document.createElement('p');
            cardRegion.innerHTML = "<strong>Region:</strong> " + animal.region;

            const cardButtons = document.createElement('div')
            cardButtons.className = "card-buttons"

            const detailButton = document.createElement('button');
            detailButton.textContent = "View Details";
            detailButton.type ="button";

            const editButton = document.createElement('button');
            editButton.textContent = "Edit";
            editButton.classList.add = "edit-button";
            editButton.type ="button";

            const deleteButton = document.createElement('button');
            deleteButton.textContent = "Delete";
            deleteButton.classList.add("delete-button");
            deleteButton.type ="button";

            detailButton.onclick = function() {
                window.location.href = "details.html?id=" + animal.id;
            };

            editButton.onclick = function() {
                window.location.href = "new-animal-form.html?id=" + animal.id;
            };

            deleteButton.onclick = function() {
                fetch(baseUrl + "uniqueanimal/delete/" + animal.id, {
                    method: "DELETE"
                })
                .then(response => {
                    if (response.ok) {
                        window.location.reload();
                    } else {
                        alert("Failed to delete the animal.");
                    }
                });
            };

            container.appendChild(card);
            card.appendChild(img);
            card.appendChild(cardHeading);
            cardHeading.appendChild(animalName);
            cardHeading.appendChild(uniqueElements);
            cardHeading.appendChild(cardRegion);
            cardHeading.appendChild(cardButtons);
            cardButtons.appendChild(detailButton);
            cardButtons.appendChild(editButton);        
            cardButtons.appendChild(deleteButton);
        };

        fetch(baseUrl + "uniqueanimals")
        .then(Response => Response.json())
        .then(data => data.forEach(animal => createAnimalCard(animal)));

        searchInput.oninput = function() {
            const filter = searchInput.value.toLowerCase();
            if(filter === "") {
                container.innerHTML = "";
                fetch(baseUrl + "uniqueanimals")
                .then(Response => Response.json())
                .then(data => data.forEach(animal => createAnimalCard(animal)));
                return;
            }else{
            container.innerHTML = "";
            fetch(baseUrl + "uniqueanimals/region/" + filter)
            .then(Response => Response.json())
            .then(data => data.forEach(animal => createAnimalCard(animal)));
            }
        };
    </script>

</body>
</html>
